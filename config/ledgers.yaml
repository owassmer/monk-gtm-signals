    unit: department
    description: invoice_description

  - id: riverside_county
    payer: Riverside County, CA
    level: county
    domain: data.countyofriverside.us
    datasets: [swwh-4ka9]
    vendor: vendor_name
    paid: date
    amount: amount
    unit: department
    invoice_id: invoice_id
    description: description

  - id: ramsey_county
    payer: Ramsey County, MN
    level: county
    domain: data.ramseycountymn.gov
    datasets: [4htu-nawa]
    vendor: supplier_name
    paid: payment_date
    amount: amount
    unit: department_name
    invoice_id: invoice_id
    description: description

  - id: providence
    payer: Providence, RI
    level: city
    domain: data.providenceri.gov
    datasets: [u4ks-kiwa]
    vendor: vendor_name
    paid: date
