  - id: connecticut
    payer: State of Connecticut
    level: state
    domain: data.ct.gov
    datasets: [ajdm-rvz7]
    vendor: vendor
    paid: payment_date
    amount: amount
    unit: program                       # agency name lives in `program`; `department` holds the SID description
    invoice_id: invoice_id
